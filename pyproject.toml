[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-pathway-escalation-evidence-agent"
version = "0.1.0"
description = "Milestone 1 foundation for a synthetic NHS pathway escalation and evidence agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ibraheem Adeleke" }]
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools]
packages = ["app", "agents", "tools", "mcp_servers", "schemas", "security", "evaluation", "services"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "agents", "tools", "mcp_servers", "schemas", "security", "evaluation", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "agents", "tools", "mcp_servers", "schemas", "security", "evaluation", "services"]
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=agents --cov=tools --cov=mcp_servers --cov=schemas --cov=security --cov=evaluation --cov=services --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app", "agents", "tools", "mcp_servers", "schemas", "security", "evaluation", "services"]

[tool.coverage.report]
fail_under = 0
show_missing = true
